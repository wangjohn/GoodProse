x-common-variables: &common-variables
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:${ARGILLA_POSTGRES_PASSWORD}@postgres:5432/argilla
  ARGILLA_REDIS_URL: redis://redis:6379/0
  HF_HUB_DISABLE_TELEMETRY: "1"

services:
  argilla:
    image: argilla/argilla-server:v2.8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARGILLA_PORT:-6900}:6900"
    environment:
      <<: *common-variables
      USERNAME: ${ARGILLA_BOOTSTRAP_USER}
      PASSWORD: ${ARGILLA_BOOTSTRAP_PASSWORD}
      API_KEY: ${ARGILLA_API_KEY}
      WORKSPACE: ${ARGILLA_WORKSPACE}
    networks: [argilla]
    volumes:
      - argilladata:/var/lib/argilla
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: argilla/argilla-server:v2.8.0
    restart: unless-stopped
    environment:
      <<: *common-variables
      BACKGROUND_NUM_WORKERS: "2"
    command: ["sh", "-c", "python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}"]
    networks: [argilla]
    volumes:
      - argilladata:/var/lib/argilla
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:14.17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ARGILLA_POSTGRES_PASSWORD}
      POSTGRES_DB: argilla
    networks: [argilla]
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argilla"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m -XX:UseSVE=0
      CLI_JAVA_OPTS: -XX:UseSVE=0
      node.name: elasticsearch
      cluster.name: es-argilla-local
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks: [argilla]
    volumes:
      - elasticdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    networks: [argilla]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  argilla:
    driver: bridge

volumes:
  argilladata:
  elasticdata:
  postgresdata:

