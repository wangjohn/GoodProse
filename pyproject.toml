[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "goodprose"
version = "0.2.0"
description = "Build and evaluate an SFT dataset from one author's blog writing."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
train = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "peft>=0.17,<1",
  "torch>=2.7,<3",
  "transformers>=4.55,<6",
  "trl>=0.21,<1",
]
train-4bit = ["bitsandbytes>=0.47,<1"]

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
goodprose = "goodprose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goodprose"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
